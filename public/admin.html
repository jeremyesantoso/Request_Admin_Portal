<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cakekue • Admin Dashboard</title>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div class="admin-container">
        <h1>cakekue &bull; Admin Dashboard</h1>
        <p class="subtitle">Manage incoming custom cake orders and quotations.</p>

        <!-- Status Filter Tabs -->
        <div class="status-filters" style="display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;">
            <button class="filter-btn active" data-status="All" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #e34a8a; color: white; border-radius: 20px; cursor: pointer; font-weight: 600;">All</button>
            <button class="filter-btn" data-status="New Inquiry" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600;">New Inquiry</button>
            <button class="filter-btn" data-status="Quote Sent" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600;">Quote Sent</button>
            <button class="filter-btn" data-status="Deposit Confirmed" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600;">Deposit Confirmed</button>
            <button class="filter-btn" data-status="Completed" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600;">Completed</button>
            <button class="filter-btn" data-status="Cancelled" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600;">Cancelled</button>
        </div>

        <div id="orders-list">
            <div class="empty-state">Loading orders...</div>
        </div>
    </div>

    <!-- Order Card Template -->
    <template id="order-card-template">
        <div class="order-card">
            <div class="order-header">
                <span class="order-title">Order #1 • Customer Name</span>
                <span class="order-badge">New Inquiry</span>
            </div>

            <div class="order-grid">
                <div class="order-info">
                    <p><strong>Email:</strong> <span class="field-email"></span></p>
                    <p><strong>Mobile:</strong> <span class="field-mobile"></span></p>
                    <p><strong>Pickup:</strong> <span class="field-pickup"></span></p>
                    <p><strong>Cake Config:</strong> <span class="field-config"></span></p>
                    <p><strong>Flavour:</strong> <span class="field-flavour"></span></p>
                    <p><strong>Payment Method:</strong> <span class="field-payment"></span></p>
                    <p><strong>Candles:</strong> <span class="field-candles">None</span></p>
                    <p><strong>Add-ons:</strong> <span class="field-addons">None</span></p>
                    <p><strong>Design Notes:</strong> <span class="field-design-notes">None</span></p>
                    <p><strong>Dietary Notes:</strong> <span class="field-diet-notes">None</span></p>
                </div>

                <div class="order-actions">
                    <div class="photo-preview-container">
                        <strong>Inspiration Photos:</strong>
                    </div>

                    <div class="action-controls">
                        <div class="input-group">
                            <label>Total Price ($):</label>
                            <input type="number" step="0.01" class="price-input" placeholder="0.00">
                        </div>

                        <div class="input-group">
                            <label>Status:</label>
                            <select class="status-select">
                                <option value="New Inquiry">New Inquiry</option>
                                <option value="Quote Sent">Quote Sent</option>
                                <option value="Deposit Confirmed">Deposit Confirmed</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>

                        <button class="save-btn">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="/admin.js"></script>
</body>
</html>
