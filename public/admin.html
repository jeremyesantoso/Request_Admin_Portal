<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cakekue | Admin Workspace</title>
    <link rel="stylesheet" href="styles_admin.css">
    <script src="admin.js" defer></script>
</head>
<body>
    <main class="admin-workspace">
        <header class="admin-header">
            <div class="admin-title-group">
                <h1>cakekue admin</h1>
                <p>Manage incoming custom cake inquiries, review reference imagery, and update quotes.</p>
            </div>
            <div>
                <a href="/" target="_blank" class="live-form-link">🌐 View Live Form</a>
            </div>
        </header>

        <!-- Status Filter Tabs Bar -->
        <div class="status-filters" style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
            <button class="filter-btn active" data-status="All" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #e34a8a; color: white; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;">All</button>
            <button class="filter-btn" data-status="New Inquiry" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;">New Inquiry</button>
            <button class="filter-btn" data-status="Quote Sent" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;">Quote Sent</button>
            <button class="filter-btn" data-status="Deposit Paid" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;">Deposit Paid</button>
            <button class="filter-btn" data-status="In Progress" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;">In Progress</button>
            <button class="filter-btn" data-status="Completed" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;">Completed</button>
            <button class="filter-btn" data-status="Cancelled" style="padding: 8px 14px; border: 1px solid #fec5e5; background: #fff1fa; color: #e34a8a; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;">Cancelled</button>
        </div>

        <!-- Customer Search Bar -->
        <div class="search-bar-wrapper" style="margin-bottom: 24px;">
            <input
                type="search"
                id="customer-search"
                class="search-input"
                placeholder="🔍 Search by customer name or email..."
                aria-label="Search by customer name or email"
            />
        </div>

        <section id="orders-list">
            <div class="empty-state">Loading incoming inquiries...</div>
        </section>
    </main>

    <!-- Reusable Order Card Template -->
    <template id="order-card-template">
        <div class="order-card">
            <div class="order-header">
                <div class="order-title-row">
                    <h3 class="order-title"></h3>
                    <span class="unread-pill" style="display: none;">NEW / UNSEEN</span>
                </div>
                <span class="badge order-badge" id=""></span>
            </div>
            
            <div class="order-grid">
                <div><strong>Email:</strong> <span class="field-email"></span></div>
                <div><strong>Mobile:</strong> <span class="field-mobile"></span></div>
                <div><strong>Pickup:</strong> <span class="field-pickup"></span></div>
                <div><strong>Configuration:</strong> <span class="field-config"></span></div>
                <div><strong>Flavour:</strong> <span class="field-flavour"></span></div>
                <div><strong>Payment Choice:</strong> <span class="field-payment"></span></div>

                <div class="field-candles-container">
                    <strong>Candles:</strong> <span class="field-candles"></span>
                </div>
                <div class="field-addons-container">
                    <strong>Add-ons:</strong> <span class="field-addons"></span>
                </div>
            </div>

            <div class="order-notes-box">
                <div class="note-row"><strong>Design Notes:</strong> <span class="field-design-notes"></span></div>
                <div><strong>Dietary Restrictions:</strong> <span class="field-diet-notes"></span></div>
            </div>

            <div>
                <span class="ref-photos-label">Reference Photos:</span>
                <div class="photo-preview-container"></div>
            </div>

            <div class="admin-actions">
                <input type="number" step="0.01" placeholder="Final Price ($)" class="price-input" id="">
                <select class="status-select" id="">
                    <option value="New Inquiry">New Inquiry</option>
                    <option value="Quote Sent">Quote Sent</option>
                    <option value="Deposit Paid">Deposit Paid</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
                <button class="btn-primary save-btn" id="">Save Changes</button>
            </div>
        </div>
    </template>
</body>
</html>
