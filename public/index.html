<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cakekue | Custom Cake Designs Inquiry Form</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="portal-container">
      <div class="header-section">
        <h1 class="brand-title">cakekue</h1>
        <div class="brand-subtitle">🎂 custom designs - Vancouver BC</div>
      </div>

      <form id="orderForm" enctype="multipart/form-data">
        <div class="form-section-title">1. Contact Information</div>

        <div class="form-group">
          <label>Your Name *</label>
          <input
            type="text"
            name="customer_name"
            placeholder="e.g. Jane Doe"
            required
          />
        </div>

        <div class="form-group">
          <label>Email *</label>
          <input
            type="text"
            name="customer_email"
            placeholder="e.g. email@domain.com"
            required
          />
        </div>

        <div class="form-group">
          <label>Mobile *</label>
          <input
            type="text"
            name="customer_mobile"
            placeholder="e.g. 604-123-4567"
            required
          />
        </div>

        <div class="form-section-title">2. Pickup Details</div>

        <div class="form-group">
            <label>Pickup Date *</label>
            <input type="date" id="pickup_date" name="pickup_date" required>
            <div class="notice">Available everyday. Special hours apply on Mondays and Tuesdays.</div>
        </div>

        <div class="form-group">
            <label>Pickup Time *</label>
            <select id="pickup_time" name="pickup_time" required disabled>
                <option value="">Please select a valid pickup date first</option>
            </select>
        </div>

        <div class="form-section-title">3. Cake Specifications</div>

        <div class="form-group">
          <label>Cake Shape *</label>
          <select name="cake_shape" required>
            <option value="" disabled selected>Please select a shape</option>
            <option value='Round'>Round</option>
            <option value='Heart'>Heart</option>
            <option value='Custom'>Custom</option>
          </select>
        </div>

        <div class="form-group">
          <label>Cake Size *</label>
          <select name="cake_size" required>
            <option value="" disabled selected>Please select a size</option>
            <option value='Bento (4")'>Bento (4”) serves 1-2</option>
            <option value='Standard (6")'>Standard (6”) serves 6-8</option>
            <option value='Large (8")'>Large (8”) serves 10-12</option>
            <option value='Big Celebration (4" + 6")'>
              Big Celebration (4” + 6”) serves 10-12
            </option>
            <option value='Big Celebration (6" + 8")'>
              Big Celebration (6” + 8”) serves 24-26
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Cake Flavour *</label>
          <select name="cake_flavour" required>
            <option value="" disabled selected>Please select a flavour</option>
            <option value="Classic Vanilla">Classic Vanilla</option>
            <option value="Chocolate Hazelnut">Chocolate Hazelnut</option>
            <option value="Strawberry Shortcake">Strawberry Shortcake</option>
            <option value="Red Velvet">Red Velvet</option>
          </select>
        </div>

        <div class="form-group">
          <label>Candle Add-on</label>
          <select name="candle_option">
            <option value="None">None</option>
            <option value="Standard (+$1)">Standard (+$1)</option>
            <option value="Premium (+$3)">Premium (+$3)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Dietary Restrictions / Allergies</label>
          <input
            type="text"
            name="diet_notes"
            placeholder="e.g. Nut allergy, gluten free..."
          />
        </div>

        <div class="form-section-title">4. Design & Inspiration</div>

        <div class="form-group">
          <label>Special Message / Design Description</label>
          <textarea
            name="design_message_notes"
            placeholder="Describe writing on cake, color theme, design details..."
          ></textarea>
        </div>

        <div class="form-group">
          <label>Inspiration Pictures (Optional)</label>
          <div class="file-input-wrapper">
            <input type="file" name="inspo_photos" multiple accept="image/*" />
          </div>
        </div>

        <div class="form-group">
          <label>Preferred Payment Method</label>
          <select name="payment_method">
            <option value="" disabled selected>Please select a payment method</option>
            <option value="E-Transfer">E-Transfer</option>
            <option value="Cash">Cash</option>
          </select>
        </div>

        <div class="form-group terms-group">
          <input type="checkbox" id="terms_consent" name="terms_consent" required>
            <label for="terms_consent">
                I understand that orders that are confirmed / 50% deposited in less than 3 days prior to pickup day will include an urgent fee in your invoice.
            </label>
        </div>

        <div class="deposit-warning">
          *50% NONREFUNDABLE DOWNPAYMENT IS REQUIRED TO SECURE YOUR ORDER 🙂
        </div>

        <button type="submit">Submit Inquiry</button>
      </form>
    </div>
  </body>
</html>
